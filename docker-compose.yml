services:
#TODO: add check that it is up
  postgres:
    build: build
    env_file:
      - ./env/db.env # read by init script to create MULTIPLE dbs
    environment:
      - S3_URL=${POSTGRES_S3_URL}
      - S3_BUCKET=${POSTGRES_S3_BUCKET}
      - S3_ACCESS_KEY_ID=${POSTGRES_S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${POSTGRES_S3_SECRET_ACCESS_KEY}
      - PGDATA=/var/lib/postgresql/data/pgdata # PGDATA is not a mountpoint but 1 level deeper, see https://bugzilla.redhat.com/show_bug.cgi?id=1247477 for reasons
      - PGEZ_ARCHIVE_TIMEOUT_SECONDS=600
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

